<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censer JR S.A.S - Consulta de Descuentos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --red: #d62828;
            --green: #128448;
            --ink: #17211b;
            --muted: #65736b;
            --line: #dce7df;
            --paper: #ffffff;
            --wash: #f2f7f2;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 18px;
            color: var(--ink);
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef7f0 0%, #ffffff 48%, #fff4ef 100%);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid rgba(18, 132, 72, .15);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(32, 67, 45, .12);
        }

        .header {
            position: relative;
            padding: 36px 24px;
            text-align: center;
            background: radial-gradient(circle at 8% 15%, rgba(18, 132, 72, .12), transparent 27%), #fbfdfb;
            border-bottom: 1px solid var(--line);
        }

        .header img { width: min(260px, 80%); height: auto; }
        .header h1 { margin: 16px 0 6px; font-size: clamp(1.4rem, 3.5vw, 2rem); font-family: Georgia, serif; }
        .header p { margin: 0; color: var(--muted); font-size: .95rem; }

        .workspace { padding: 28px clamp(18px, 4vw, 48px) 40px; }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; padding: 6px; background: var(--wash); border-radius: 12px; }
        .tab-btn { padding: 12px 16px; color: var(--muted); background: transparent; border: 0; border-radius: 8px; font: 700 .95rem Arial, sans-serif; cursor: pointer; transition: .2s ease; }
        .tab-btn.active { color: var(--paper); background: var(--red); box-shadow: 0 4px 12px rgba(214, 40, 40, .2); }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: appear .25s ease-out; }

        .form-group { margin-bottom: 18px; }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }

        label { display: block; margin-bottom: 6px; color: var(--ink); font-weight: 700; font-size: .88rem; }
        input, select { width: 100%; padding: 12px 14px; color: var(--ink); background: #fbfdfb; border: 1px solid #cbdad0; border-radius: 8px; font-size: .95rem; transition: border-color .2s; }
        input:focus, select:focus { outline: 0; border-color: var(--green); box-shadow: 0 0 0 3px rgba(18, 132, 72, .12); }

        .btn { width: 100%; padding: 12px 18px; color: white; background: var(--green); border: 0; border-radius: 8px; font: 700 1rem Arial, sans-serif; cursor: pointer; transition: background .2s; }
        .btn:hover { background: #0c6c3a; }
        .btn-secondary { background: var(--muted); margin-top: 8px; }
        .btn-danger { background: var(--red); }

        .result-box, .admin-box { margin-top: 24px; padding: 20px; background: #fbfdfb; border: 1px solid var(--line); border-radius: 12px; }
        
        table { width: 100%; margin-top: 12px; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: .9rem; }
        th { color: #fff; background: var(--red); text-transform: uppercase; letter-spacing: .03em; font-size: .8rem; }

        .alert { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: .9rem; }
        .alert-error { color: #8b2024; background: #fff0f0; border: 1px solid #f1c5c5; }
        .alert-success { color: #14623b; background: #eef9f1; border: 1px solid #bfdfc8; }

        @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .workspace { padding: 18px 12px; }
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.svg" alt="Censer JR S.A.S">
        <h1>Consulta de Descuentos Nominativos</h1>
        <p>Acceso seguro e instantáneo a tu información laboral</p>
    </div>

    <div class="workspace">
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-empleado">Consulta Empleado</button>
            <button class="tab-btn" id="btn-tab-admin">Administrador</button>
        </div>

        <!-- Módulo Empleado -->
        <div id="tab-empleado" class="tab-content active">
            <div class="form-group">
                <label for="cedula">Número de Cédula:</label>
                <input type="text" id="cedula" placeholder="Ej: 123456789" inputmode="numeric" autocomplete="off">
            </div>
            <button class="btn" id="btn-consultar">Consultar Registros</button>
            <div id="empleado-alert" class="alert"></div>

            <div id="resultado" class="result-box" style="display: none;">
                <h3 id="nombre-empleado"></h3>
                
                <!-- Filtros para Empleado -->
                <div class="filter-grid">
                    <div>
                        <label for="filter-mes">Filtrar por Mes:</label>
                        <select id="filter-mes">
                            <option value="">Todos los meses</option>
                        </select>
                    </div>
                    <div>
                        <label for="sort-monto">Ordenar por Monto:</label>
                        <select id="sort-monto">
                            <option value="none">Sin orden específico</option>
                            <option value="desc">Mayor a Menor</option>
                            <option value="asc">Menor a Mayor</option>
                        </select>
                    </div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Mes</th>
                            <th>Concepto</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-descuentos"></tbody>
                </table>
            </div>
        </div>

        <!-- Módulo Administrador -->
        <div id="tab-admin" class="tab-content">
            <div id="admin-login-form">
                <div class="form-group">
                    <label for="admin-email">Correo Electrónico:</label>
                    <input type="email" id="admin-email" value="censerjrsas@hotmail.com">
                </div>
                <div class="form-group">
                    <label for="admin-pass">Contraseña:</label>
                    <input type="password" id="admin-pass" placeholder="••••••••">
                </div>
                <button class="btn" id="btn-login">Ingresar al Panel</button>
                <div id="login-alert" class="alert"></div>
            </div>

            <div id="admin-panel" class="admin-box" style="display: none;">
                <h3>Cargar Base de Datos</h3>
                <p style="color: var(--muted); font-size: 0.9rem;">Suba un archivo (.xlsx o .csv) con las columnas: <strong>cedula, nombre, mes, concepto, monto</strong></p>
                
                <div class="form-group">
                    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
                </div>
                <button class="btn" id="btn-procesar">Cargar Datos</button>
                <button class="btn btn-secondary" id="btn-logout">Cerrar Sesión</button>
                <div id="admin-alert" class="alert"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import { getFirestore, collection, getDocs, query, where, writeBatch, doc } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    const firebaseConfig = {
        apiKey: 'AIzaSyCUAOJDAnRt0P6ZA6QypqsB-UXifddMQi0',
        authDomain: 'censer-descuentos.firebaseapp.com',
        projectId: 'censer-descuentos',
        storageBucket: 'censer-descuentos.firebasestorage.app',
        messagingSenderId: '361651122880',
        appId: '1:361651122880:web:bb7100a78dc5782015f325'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let rawData = [];

    // --- Control de Interfaz ---
    const switchTab = (activeTab) => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if (activeTab === 'empleado') {
            document.getElementById('btn-tab-empleado').classList.add('active');
            document.getElementById('tab-empleado').classList.add('active');
        } else {
            document.getElementById('btn-tab-admin').classList.add('active');
            document.getElementById('tab-admin').classList.add('active');
        }
    };

    const showAlert = (elementId, message, type) => {
        const el = document.getElementById(elementId);
        el.className = `alert alert-${type}`;
        el.textContent = message;
        el.style.display = 'block';
    };

    // --- Lógica de Negocio y Filtros ---
    const renderTable = () => {
        const selectedMes = document.getElementById('filter-mes').value;
        const sortOrder = document.getElementById('sort-monto').value;
        const tbody = document.getElementById('tabla-descuentos');

        let filtered = rawData.filter(item => !selectedMes || item.mes === selectedMes);

        if (sortOrder === 'asc') filtered.sort((a, b) => a.monto - b.monto);
        if (sortOrder === 'desc') filtered.sort((a, b) => b.monto - a.monto);

        tbody.innerHTML = filtered.map(reg => `
            <tr>
                <td>${reg.mes || '-'}</td>
                <td>${reg.concepto || '-'}</td>
                <td>$${Number(reg.monto).toLocaleString('es-CO')}</td>
            </tr>
        `).join('');
    };

    const setupFilters = () => {
        const selectMes = document.getElementById('filter-mes');
        const meses = [...new Set(rawData.map(r => r.mes))].filter(Boolean);
        
        selectMes.innerHTML = '<option value="">Todos los meses</option>' + 
            meses.map(m => `<option value="${m}">${m}</option>`).join('');

        renderTable();
    };

    const consultarDescuentos = async () => {
        const cedula = document.getElementById('cedula').value.trim();
        const alertId = 'empleado-alert';
        
        document.getElementById(alertId).style.display = 'none';
        document.getElementById('resultado').style.display = 'none';

        if (!cedula) return showAlert(alertId, 'Ingrese un número de cédula.', 'error');

        try {
            const q = query(collection(db, 'descuentos'), where('cedula', '==', cedula));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                return showAlert(alertId, 'No se encontraron registros asociadas a la cédula.', 'error');
            }

            rawData = snapshot.docs.map(d => d.data());
            document.getElementById('nombre-empleado').textContent = rawData[0].nombre ? `Empleado: ${rawData[0].nombre}` : `Cédula: ${cedula}`;
            
            setupFilters();
            document.getElementById('resultado').style.display = 'block';
        } catch (err) {
            showAlert(alertId, 'Error de conexión. Verifique su red o las reglas de acceso.', 'error');
        }
    };

    // --- Administración y Carga de Archivos ---
    const procesarArchivo = async () => {
        const fileInput = document.getElementById('excel-file');
        const file = fileInput.files[0];
        const alertId = 'admin-alert';

        if (!file) return showAlert(alertId, 'Seleccione un archivo.', 'error');

        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' });

                if (!json.length) return showAlert(alertId, 'El archivo está vacío.', 'error');

                // Sobrescribir colección
                const oldDocs = await getDocs(collection(db, 'descuentos'));
                const batch = writeBatch(db);
                
                oldDocs.forEach(d => batch.delete(d.ref));
                json.forEach(row => {
                    if (row.cedula && row.mes) {
                        const newRef = doc(collection(db, 'descuentos'));
                        batch.set(newRef, {
                            cedula: String(row.cedula).trim(),
                            nombre: String(row.nombre || '').trim(),
                            mes: String(row.mes).trim(),
                            concepto: String(row.concepto || '').trim(),
                            monto: Number(row.monto) || 0
                        });
                    }
                });

                await batch.commit();
                showAlert(alertId, 'Base de datos cargada exitosamente.', 'success');
                fileInput.value = '';
            } catch (err) {
                showAlert(alertId, 'Error al procesar el archivo o guardar en base de datos.', 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    };

    // --- Event Listeners & Auth Handler ---
    document.getElementById('btn-tab-empleado').addEventListener('click', () => switchTab('empleado'));
    document.getElementById('btn-tab-admin').addEventListener('click', () => switchTab('admin'));
    document.getElementById('btn-consultar').addEventListener('click', consultarDescuentos);
    document.getElementById('filter-mes').addEventListener('change', renderTable);
    document.getElementById('sort-monto').addEventListener('change', renderTable);
    document.getElementById('btn-procesar').addEventListener('click', procesarArchivo);

    document.getElementById('btn-login').addEventListener('click', async () => {
        const email = document.getElementById('admin-email').value;
        const pass = document.getElementById('admin-pass').value;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (e) {
            showAlert('login-alert', 'Credenciales inválidas.', 'error');
        }
    });

    document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
        document.getElementById('admin-login-form').style.display = user ? 'none' : 'block';
        document.getElementById('admin-panel').style.display = user ? 'block' : 'none';
    });
</script>
</body>
</html>
